server:
  port: 8083
spring:
  application:
    name: blog-service
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dianping_blog?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
hmdp:
  security:
    excludepaths: /blog/hot,/upload/**
mybatis-plus:
  type-aliases-package: com.dianping.blog.entity
