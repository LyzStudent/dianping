server:
  port: 8084
spring:
  application:
    name: trade-service
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
    sentinel:
      transport:
        dashboard: localhost:8090
        port: 8719
      eager: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dianping_trade?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
  rabbitmq:
    host: localhost
    username: guest
    password: guest
    virtual-host: /
    port: 5672
    listener:
      simple:
        concurrency: 10
        max-concurrency: 10
        prefetch: 1
        default-requeue-rejected: false #消费失败不无限重入队，进死信队列
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
hmdp:
  security:
    excludepaths: /voucher/**
mybatis-plus:
  type-aliases-package: com.dianping.trade.entity

seata:
  enabled: true
  application-id: ${spring.application.name:}
  tx-service-group: dianping_tx_group
  service:
    vgroup-mapping:
      dianping_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

seckill:
  order:
    ttl-minutes: 15