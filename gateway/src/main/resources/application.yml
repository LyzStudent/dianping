server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:${spring.application.name}.yml
  cloud:
    sentinel:
      transport:
        dashboard: 8090
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
    gateway:
      # 前端跨域：允许任何来源访问（开发/测试用），allowed-origin-patterns 可与 allow-credentials 共存
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/shop/**,/shop-type/**,/shop-review/**,/upload/**
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=/blog/**,/blog-comments/**,/follow/**
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/voucher/**,/seckill/**
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
hmdp:
  jwt:
    secret: dianping-microservice-hm-dianping-secret-2026abcd
  security:
    excludepaths: /user/login,/user/code,/blog/hot,/shop/**,/shop-type/**,/upload/**,/voucher/**
