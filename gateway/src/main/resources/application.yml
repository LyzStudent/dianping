server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    import:
      - optional:nacos:common.yml
      - optional:nacos:${spring.application.name}.yml
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8090
        port: 8719
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
    gateway:
      # 前端跨域：允许任何来源访问（开发/测试用），allowed-origin-patterns 可与 allow-credentials 共存
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/shop/**,/shop-type/**,/shop-review/**,/upload/**
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=/blog/**,/blog-comments/**,/follow/**
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/voucher/**,/seckill/**,/voucher-order/**
        - id: shop-merchant
          uri: lb://shop-service
          predicates:
            - Path=/merchant/shop/**
        - id: trade-merchant
          uri: lb://trade-service
          predicates:
            - Path=/merchant/voucher/**,/merchant/voucher-order/**
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
hmdp:
  jwt:
    secret: dianping-microservice-hm-dianping-secret-2026abcd
  security:
    excludepaths: /user/login,/user/code,/user/loginByPassword,/user/register,/user/registerByPhone,/blog/hot,/shop/**,/shop-type/**,/upload/**,/voucher/**
    # 受保护后台路径：即使命中上面的 /shop/** 白名单也必须校验登录（否则 /shop/admin/** 漏检）
    protectpaths: /shop/admin/**,/shop/merchant/**,/shop/inner/**,/voucher/merchant/**,/shop/favorite/**
